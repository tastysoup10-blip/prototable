    <!-- No canonical link tag here on purpose. This shell is served for

    <!-- ─ JSON-LD Structured Data ─ -->

      "@context": "https://schema.org",

    <!-- ─ Dark-mode bootstrap ─ -->
    <!-- Apply the dark-mode class on <html> before first paint so we never
         flash light mode. Dark is the default; only an explicit 'false' is light. -->
    <!-- The server writes a text summary into #root for crawlers that don't run
         scripts (apps/api/src/lib/crawlable.ts). A browser that runs this
         never shows it: the app mounts over it, and before then it would be
         a wall of text. -->
    <style>html.js #root > main[data-crawl] { display: none }</style>
    <script>
      document.documentElement.classList.add('js');
      try {
        if (localStorage.getItem('ptc_darkMode') !== 'false') {
          document.documentElement.classList.add('dark');
        }
        // Settings -> Appearance -> Color (src/lib/a11yPrefs.ts): set before the first paint.
        var darkColor = localStorage.getItem('ptc_darkColor');
        if (darkColor !== 'slate') document.documentElement.classList.add(darkColor === 'midnight' ? 'ptc-color-midnight' : 'ptc-color-charcoal');
        // Settings -> Accessibility (src/lib/a11yPrefs.ts): set before the first paint.
        var a11y = { ptc_highContrast: 'hc', ptc_focusRing: 'kf', ptc_reduceMotion: 'rm', ptc_colorblind: 'cb' };
        for (var key in a11y) {
          if (localStorage.getItem(key) === '1') document.documentElement.classList.add(a11y[key]);
        }
        var textSize = localStorage.getItem('ptc_textSize');
        if (textSize === 'large' || textSize === 'larger') document.documentElement.dataset.text = textSize;
      } catch (e) {}
    </script>

    <!-- ─ Icons ─ -->
    <!-- SVG is primary in modern browsers and swaps light/dark with the
         toolbar theme (see the media query inside). PNG + .ico are the
         static light-mark fallback for Safari and older browsers.
         The ?v=N query busts Cloudflare's edge cache AND the browser's
         sticky favicon cache when the art changes at the same path —
         BUMP IT whenever a favicon file changes. -->
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
